name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run complete test suite
        run: uv run pytest

  build-distributions:
    name: Build and validate distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and source distribution
        run: ./scripts/validate-release.sh --build "$PWD/dist"
      - name: Validate package metadata and artifact contents
        run: ./scripts/validate-release.sh --validate-artifacts "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  validate-wheel:
    name: Validate wheel installation
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install wheel and smoke-test CLI
        run: ./scripts/validate-release.sh --smoke wheel dist/*.whl "$PWD/wheel-results"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-results
          path: wheel-results/
          if-no-files-found: error

  validate-sdist:
    name: Validate source distribution installation
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install source distribution and smoke-test CLI
        run: ./scripts/validate-release.sh --smoke sdist dist/*.tar.gz "$PWD/sdist-results"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-results
          path: sdist-results/
          if-no-files-found: error

  compare-artifacts:
    name: Compare artifact behavior
    needs: [validate-wheel, validate-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-results
          path: wheel-results
      - uses: actions/download-artifact@v4
        with:
          name: sdist-results
          path: sdist-results
      - name: Compare captured CLI results
        run: ./scripts/validate-release.sh --compare wheel-results sdist-results
