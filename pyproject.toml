[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instrproof"
version = "0.1.0"
description = "Detect broken repository paths in AI coding instructions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
instrproof = "instrproof.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
